<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Apple Touch Icon pour iPhone -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Nom de l'app sur l'écran d'accueil -->
    <meta name="apple-mobile-web-app-title" content="FOOD HOME">
    
    <!-- Mode plein écran (masquer la barre Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Couleur de la barre de statut -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Favicon standard pour navigateurs -->
    <link rel="icon" type="image/png" href="/apple-touch-icon.png">
    
    <title>FOOD HOME - Connexion</title>
    <link rel="stylesheet" href="/css/tokens.css" />
    <script src="/theme.js"></script>
    <!-- PWA : manifest, couleur de thème, enregistrement du service worker -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4F8CFF" />
    <script src="/pwa.js" defer></script>
    <!-- Supabase : auth Google + sync (voir cloud.js) -->
    <script src="/vendor/supabase.js"></script>
    <script src="/supabase-config.js"></script>
    <script src="/cloud.js"></script>
    <style>

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: var(--font-primary);
        background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-secondary) 50%, #f093fb 100%);
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 440px;
        animation: slideInUp 0.5s ease-out;
      }

      @keyframes slideInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .login-card {
        background: rgb(from var(--surface) r g b / 0.95);
        backdrop-filter: blur(20px) saturate(180%);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: var(--radius-2xl);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 8px 32px rgba(0, 0, 0, 0.1);
        padding: 48px 40px;
        text-align: center;
        transition: transform 0.3s ease;
      }

      .login-card:hover {
        transform: translateY(-4px);
      }

      .logo {
        width: 90px;
        height: 90px;
        margin: 0 auto 24px;
        background: var(--gradient-primary);
        border-radius: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        box-shadow: 0 10px 25px rgb(from var(--brand-primary) r g b / 0.3);
        animation: scaleIn 0.5s ease-out 0.2s both;
      }

      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      h1 {
        font-size: 32px;
        font-weight: 800;
        margin-bottom: 8px;
        background: var(--gradient-primary);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: var(--text-secondary);
        margin-bottom: 32px;
        font-size: 15px;
      }

      .pin-input-container {
        display: flex;
        gap: 12px;
        justify-content: center;
        margin-bottom: 32px;
      }

      .pin-digit {
        width: 68px;
        height: 68px;
        font-size: 32px;
        font-weight: 700;
        text-align: center;
        border: 2px solid rgb(from var(--brand-primary) r g b / 0.15);
        border-radius: 16px;
        background: rgb(from var(--surface) r g b / 0.8);
        color: var(--text-primary);
        transition: all var(--transition-base);
      }

      .pin-digit:focus {
        outline: none;
        border-color: var(--brand-primary);
        background: var(--surface);
        box-shadow: 0 0 0 4px rgb(from var(--brand-primary) r g b / 0.1);
        transform: scale(1.05);
      }

      .btn {
        width: 100%;
        padding: 16px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: var(--radius-full);
        background: var(--gradient-primary);
        color: white;
        cursor: pointer;
        transition: all var(--transition-base);
        box-shadow: 0 4px 16px rgb(from var(--brand-primary) r g b / 0.3);
        position: relative;
        overflow: hidden;
      }

      .btn::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, var(--brand-secondary) 0%, var(--brand-primary) 100%);
        opacity: 0;
        transition: opacity var(--transition-base);
      }

      .btn:hover::before {
        opacity: 1;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 24px rgb(from var(--brand-primary) r g b / 0.4);
      }

      .btn > * {
        position: relative;
        z-index: 1;
      }

      .error-message {
        background: linear-gradient(135deg, #fee2e2 0%, #fecaca 100%);
        border: 2px solid rgba(239, 68, 68, 0.2);
        color: #dc2626;
        padding: 14px 18px;
        border-radius: 16px;
        margin-bottom: 24px;
        font-size: 14px;
        font-weight: 500;
        display: none;
        animation: slideInUp 0.3s ease-out;
      }

      .error-message.show {
        display: block;
      }

      .info-box {
        margin-top: 28px;
        padding: 18px 20px;
        background: linear-gradient(135deg, var(--accent-bg-2) 0%, var(--accent-bg-3) 100%);
        border: 2px solid rgb(from var(--accent-strong) r g b / 0.2);
        border-radius: 16px;
        font-size: 13px;
        color: var(--accent-ink);
        box-shadow: 0 4px 12px rgb(from var(--accent-strong) r g b / 0.08);
      }

      .info-box strong {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
      }

      @media (max-width: 480px) {
        .login-card { padding: 36px 28px; }
        .logo { width: 75px; height: 75px; font-size: 40px; }
        h1 { font-size: 28px; }
        .pin-digit { width: 58px; height: 58px; font-size: 28px; }
      }
      /* Séparateur « ou » */
      .sep {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 22px 0 16px;
        color: var(--text-secondary, #94a3b8);
        font-size: 13px;
      }
      .sep::before, .sep::after {
        content: "";
        flex: 1;
        height: 1px;
        background: rgba(148, 163, 184, 0.35);
      }
      /* Bouton « Continuer avec Google » */
      .btn-google {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 13px 16px;
        border-radius: var(--radius-lg, 12px);
        border: 1px solid rgba(148, 163, 184, 0.45);
        background: #ffffff;
        color: #1f2937;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: box-shadow 0.2s, transform 0.1s;
      }
      .btn-google:hover {
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
      }
      .btn-google:active { transform: translateY(1px); }
      .btn-google svg { flex: 0 0 auto; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">🏠</div>
            <h1>FOOD HOME</h1>
            <p class="subtitle">Bienvenue ! Entrez votre code PIN</p>
            
            <div class="error-message" id="errorMessage">
                ⚠️ Code PIN invalide
            </div>
            
            <form id="loginForm">
                <div class="pin-input-container">
                    <input type="text" class="pin-digit" maxlength="1" id="pin1" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="pin-digit" maxlength="1" id="pin2" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="pin-digit" maxlength="1" id="pin3" inputmode="numeric" pattern="[0-9]" required>
                    <input type="text" class="pin-digit" maxlength="1" id="pin4" inputmode="numeric" pattern="[0-9]" required>
                </div>
                
                <button type="submit" class="btn">
                    <span>🔓 Se connecter</span>
                </button>
            </form>

            <div class="sep"><span>ou</span></div>

            <button type="button" id="googleBtn" class="btn-google">
                <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                    <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
                    <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
                </svg>
                <span>Continuer avec Google</span>
            </button>
        </div>
    </div>
    
    <script>
      const pinInputs = document.querySelectorAll('.pin-digit');
      const form = document.getElementById('loginForm');
      const errorMessage = document.getElementById('errorMessage');
      
      // Code PIN par défaut (stocké en localStorage)
      const DEFAULT_PIN = '2504';
      
      // Focus premier input
      pinInputs[0].focus();
      
      // Gestion des inputs
      pinInputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
          const value = e.target.value.replace(/[^0-9]/g, '');
          e.target.value = value;
          
          if (value && index < pinInputs.length - 1) {
            pinInputs[index + 1].focus();
          }
          
          // Auto-submit si 4 digits
          if (index === 3 && value) {
            setTimeout(() => form.requestSubmit(), 100);
          }
        });
        
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Backspace' && !e.target.value && index > 0) {
            pinInputs[index - 1].focus();
          }
        });
        
        input.addEventListener('paste', (e) => {
          e.preventDefault();
          const pastedData = e.clipboardData.getData('text').replace(/[^0-9]/g, '');
          
          for (let i = 0; i < Math.min(pastedData.length, 4); i++) {
            if (pinInputs[i]) {
              pinInputs[i].value = pastedData[i];
            }
          }
          
          if (pastedData.length >= 4) {
            setTimeout(() => form.requestSubmit(), 100);
          }
        });
      });
      
      // Vérifier le PIN
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const pin = Array.from(pinInputs).map(input => input.value).join('');
        
        if (pin.length !== 4) {
          showError('Veuillez entrer 4 chiffres');
          return;
        }
        
        // Récupérer le PIN sauvegardé (ou utiliser le défaut)
        const savedPin = localStorage.getItem('food_home_pin') || DEFAULT_PIN;
        
        if (pin === savedPin) {
          // Sauvegarder la session
          localStorage.setItem('food_home_logged_in', 'true');
          localStorage.setItem('food_home_login_time', Date.now().toString());
          
          // Rediriger vers l'app
          window.location.href = 'home.html';
        } else {
          showError('Code PIN invalide');
        }
      });
      
      function showError(message) {
        errorMessage.textContent = '⚠️ ' + message;
        errorMessage.classList.add('show');
        
        // Shake animation
        pinInputs.forEach(input => {
          input.style.animation = 'shake 0.5s';
          setTimeout(() => input.style.animation = '', 500);
        });
        
        setTimeout(() => {
          errorMessage.classList.remove('show');
        }, 3000);
      }
      
      // Vérifier si déjà connecté (session PIN, valable 24h)
      if (localStorage.getItem('food_home_logged_in') === 'true') {
        const loginTime = parseInt(localStorage.getItem('food_home_login_time') || '0');
        const now = Date.now();

        // Session valide 24h
        if (now - loginTime < 24 * 60 * 60 * 1000) {
          window.location.href = 'home.html';
        }
      }

      // 🔐 Connexion Google (Supabase)
      const googleBtn = document.getElementById('googleBtn');
      if (googleBtn) {
        googleBtn.addEventListener('click', () => {
          if (window.FoodHomeCloud) FoodHomeCloud.signInWithGoogle();
        });
      }
      // Retour d'OAuth ou session Google déjà active → aller à l'app.
      if (window.FoodHomeCloud) {
        FoodHomeCloud.init().then((user) => {
          if (user) window.location.href = 'home.html';
        });
      }
    </script>
</body>
</html>
