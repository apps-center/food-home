<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Apple Touch Icon pour iPhone -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    
    <!-- Nom de l'app sur l'écran d'accueil -->
    <meta name="apple-mobile-web-app-title" content="FOOD HOME">
    
    <!-- Mode plein écran (masquer la barre Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- Couleur de la barre de statut -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Favicon standard pour navigateurs -->
    <link rel="icon" type="image/png" href="/apple-touch-icon.png">
    
    <title>FOOD HOME - Application</title>
    <link rel="stylesheet" href="/css/common.css" />
    <link rel="stylesheet" href="/css/home.css" />
    <script src="/theme.js"></script>
    <!-- PWA : manifest, couleur de thème, enregistrement du service worker -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#4F8CFF" />
    <script src="/pwa.js" defer></script>
    <!-- Supabase : auth Google + sync (voir cloud.js) -->
    <script src="/vendor/supabase.js"></script>
    <script src="/supabase-config.js"></script>
    <script src="/cloud.js"></script>
    <style>
      /* Avatar Google + menu compte dans la navbar */
      .account { position: relative; }
      .account-avatar {
        width: 38px; height: 38px; border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.5);
        background: var(--accent, #4F8CFF); color: #fff;
        font-weight: 700; font-size: 15px;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; overflow: hidden; padding: 0;
      }
      .account-avatar img { width: 100%; height: 100%; object-fit: cover; }
      .account-menu {
        position: absolute; right: 0; top: calc(100% + 8px);
        min-width: 220px; padding: 14px;
        background: var(--bg-elevated, #1b2431);
        color: var(--text-primary, #e5e7eb);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 14px; box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
        display: none; z-index: 1000;
      }
      .account-menu.open { display: block; }
      .account-menu .name { font-weight: 700; font-size: 15px; }
      .account-menu .email { font-size: 13px; opacity: 0.7; margin-top: 2px; word-break: break-all; }
      .account-menu .signout {
        margin-top: 12px; width: 100%; padding: 9px 12px;
        border: none; border-radius: 10px; cursor: pointer;
        background: var(--accent, #4F8CFF); color: #fff; font-weight: 600;
        font-family: inherit; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar -->
    <div class="navbar">
      <div class="navbar-brand">
        <span>🏠</span>
        <span>FOOD HOME</span>
      </div>
      <div class="navbar-controls">
        <button class="toggle-btn" id="themeBtn" onclick="cycleTheme()" title="Thème clair / sombre">
          <span id="themeIcon">🌗</span>
          <span id="themeText">Auto</span>
        </button>
        <button class="toggle-btn" id="toggleBtn">
          <span id="toggleIcon">🔄</span>
          <span id="toggleText">Basculer</span>
        </button>
        <a href="javascript:void(0)" class="logout-btn" id="logoutBtn" onclick="logout()"
          >🚪 Déconnexion</a
        >
        <!-- Compte Google (affiché seulement si connecté via Google) -->
        <div class="account" id="account" style="display:none">
          <button class="account-avatar" id="accountAvatar" title="Mon compte"></button>
          <div class="account-menu" id="accountMenu">
            <div class="name" id="accountName"></div>
            <div class="email" id="accountEmail"></div>
            <button class="signout" onclick="logout()">Se déconnecter</button>
          </div>
        </div>
      </div>
    </div>
    <!-- App Container -->
    <div class="app-container">
      <div class="app-flipper" id="appFlipper">
        <!-- Front Face: Eat App (Meal Planner) - PAR DÉFAUT -->
        <div class="app-face front">
          <iframe
            src="eat"
            id="eatFrame"
            title="Planificateur de repas"
          ></iframe>
        </div>
        <!-- Back Face: Courses App (Shopping List) -->
        <div class="app-face back">
          <iframe
            src="courses"
            id="coursesFrame"
            title="Liste de courses"
          ></iframe>
        </div>
      </div>
    </div>
    <!-- 🎯 Bouton flottant : revenir aux filtres sans tout remonter (page Repas) -->
    <button
      id="fabFilters"
      class="fab-filters"
      type="button"
      aria-label="Aller aux filtres"
      title="Filtres"
    >
      <span class="fab-icon" aria-hidden="true">🔍</span>
      <span class="fab-label">Filtres</span>
    </button>
    <script>
      // 🔒 Vérifier la session avant d'afficher l'app
(function checkSession() {
  const isLoggedIn = localStorage.getItem("food_home_logged_in");
  const loginTime = parseInt(localStorage.getItem("food_home_login_time") || "0");
  const now = Date.now();
  // Si pas connecté ou session expirée (24h)
  if (isLoggedIn !== "true" || now - loginTime > 24 * 60 * 60 * 1000) {
    window.location.href = "index.html";
    return;
  }
})();

// Get elements
const toggleBtn = document.getElementById("toggleBtn");
const appFlipper = document.getElementById("appFlipper");
const toggleText = document.getElementById("toggleText");
const toggleIcon = document.getElementById("toggleIcon");
const coursesFrame = document.getElementById("coursesFrame");
const eatFrame = document.getElementById("eatFrame");

// 🎯 Bouton flottant « Filtres » (page Repas)
const fabFilters = document.getElementById("fabFilters");
const appFaceFront = document.querySelector(".app-face.front");
let eatScrollY = 0;       // scroll interne de l'iframe (cas desktop)
let eatModalOpen = false; // une modale est ouverte dans l'iframe eat

function updateFabFilters() {
  const onEat = !appFlipper.classList.contains("flipped");
  // Sur mobile/iOS c'est le conteneur parent qui scrolle ; sur desktop c'est
  // l'iframe (via EAT_SCROLL). On prend le maximum des deux.
  const scrolled = Math.max(eatScrollY, appFaceFront ? appFaceFront.scrollTop : 0);
  if (onEat && !eatModalOpen && scrolled > 300) {
    fabFilters.classList.add("visible");
  } else {
    fabFilters.classList.remove("visible");
  }
}
if (appFaceFront) {
  appFaceFront.addEventListener("scroll", updateFabFilters, { passive: true });
}
fabFilters.addEventListener("click", () => {
  // Remonter le conteneur parent (mobile) et demander à l'iframe de remonter
  // + d'ouvrir les filtres avancés (desktop).
  if (appFaceFront) appFaceFront.scrollTo({ top: 0, behavior: "smooth" });
  try {
    eatFrame.contentWindow.postMessage({ type: "SCROLL_TO_FILTERS" }, "*");
  } catch (e) {
    console.error("Error sending SCROLL_TO_FILTERS to eat iframe:", e);
  }
});

// 🎯 COMMUNICATION INTER-IFRAMES via postMessage
// Écouter les messages des iframes enfants
window.addEventListener("message", (event) => {
  // Vérifier l'origine pour la sécurité (optionnel en local)
  if (event.origin !== window.location.origin) return;

  const { type, data } = event.data;
  switch (type) {
    case "SHOPPING_LIST_UPDATED":
      // Eat a ajouté des items → notifier Courses de rafraîchir
      console.log("📥 Shopping list updated, notifying courses iframe...");
      try {
        coursesFrame.contentWindow.postMessage({ type: "REFRESH_DATA" }, "*");
      } catch (e) {
        console.error("Error sending message to courses iframe:", e);
      }
      break;
    case "REQUEST_REFRESH":
      // Courses demande un rafraîchissement
      console.log("🔄 Courses iframe requested refresh");
      try {
        coursesFrame.contentWindow.postMessage({ type: "REFRESH_DATA" }, "*");
      } catch (e) {
        console.error("Error refreshing courses iframe:", e);
      }
      break;
    case "EAT_SCROLL":
      // Scroll interne de l'iframe eat (cas desktop) → maj bouton flottant
      eatScrollY = event.data.scrollY || 0;
      updateFabFilters();
      break;
    case "EAT_MODAL":
      // Une modale s'ouvre/ferme dans eat → masquer/afficher le bouton flottant
      eatModalOpen = !!event.data.open;
      updateFabFilters();
      break;
  }
});

// Toggle between apps
toggleBtn.addEventListener("click", () => {
  toggleBtn.disabled = true;
  appFlipper.classList.toggle("flipped");
  const newApp = appFlipper.classList.contains("flipped") ? "courses" : "eat";
  localStorage.setItem('active_app', newApp); // Stocke en local
  updateToggleButton(newApp);
  eatScrollY = 0;
  updateFabFilters(); // masque le bouton filtres hors page Repas
 
  // 🎯 Envoyer un message à courses pour afficher la Liste courses (sans recharger l'iframe)
  if (newApp === "courses") {
    setTimeout(() => {
      try {
        coursesFrame.contentWindow.postMessage({ type: "SHOW_SHOPPING_LIST" }, "*");
        console.log("📨 Message envoyé : afficher Liste courses");
      } catch (e) {
        console.error("Error sending message to courses iframe:", e);
      }
    }, 100);
  }
  setTimeout(() => { toggleBtn.disabled = false; }, 300);
});

// Update toggle button appearance
function updateToggleButton(app) {
  if (app === "eat") {
    toggleText.textContent = "Vers Courses";
    toggleIcon.textContent = "🛒";
  } else {
    toggleText.textContent = "Vers Repas";
    toggleIcon.textContent = "🍽️";
  }
}

// Keyboard shortcut: Ctrl/Cmd + Space to toggle
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.code === "Space") {
    e.preventDefault();
    toggleBtn.click();
  }
});

// Log au chargement et set initial state from localStorage
window.addEventListener("load", () => {
  const currentApp = localStorage.getItem('active_app') || "eat";
  if (currentApp === "courses") {
    appFlipper.classList.add("flipped");
    updateToggleButton("courses");
  } else {
    updateToggleButton("eat");
  }
  updateFabFilters();
  console.log("✅ FOOD HOME loaded - postMessage communication ready");
});

// 🌗 Sélecteur de thème : cycle Auto → Clair → Sombre
const THEME_ORDER = ["auto", "light", "dark"];
const THEME_UI = {
  auto:  { icon: "🌗", text: "Auto" },
  light: { icon: "☀️", text: "Clair" },
  dark:  { icon: "🌙", text: "Sombre" },
};
function refreshThemeButton() {
  const pref = (window.getThemePref ? window.getThemePref() : "auto");
  const ui = THEME_UI[pref] || THEME_UI.auto;
  document.getElementById("themeIcon").textContent = ui.icon;
  document.getElementById("themeText").textContent = ui.text;
}
function cycleTheme() {
  const cur = (window.getThemePref ? window.getThemePref() : "auto");
  const next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
  if (window.setThemePref) window.setThemePref(next); // applique + notifie les iframes
  refreshThemeButton();
}
window.addEventListener("load", refreshThemeButton);

// Fonction de déconnexion
async function logout() {
  if (window.FoodHomeCloud) await FoodHomeCloud.signOut();
  localStorage.removeItem("food_home_logged_in");
  localStorage.removeItem("food_home_login_time");
  localStorage.removeItem("active_app");
  window.location.href = "index.html";
}

// 👤 Compte Google : avatar + menu dans la navbar
(function initAccount() {
  if (!window.FoodHomeCloud) return;

  const account = document.getElementById("account");
  const logoutBtn = document.getElementById("logoutBtn");
  const avatar = document.getElementById("accountAvatar");
  const menu = document.getElementById("accountMenu");
  const nameEl = document.getElementById("accountName");
  const emailEl = document.getElementById("accountEmail");

  function render(user) {
    if (user) {
      const meta = user.user_metadata || {};
      const fullName = meta.full_name || meta.name || user.email || "Compte";
      const picture = meta.avatar_url || meta.picture || "";
      nameEl.textContent = fullName;
      emailEl.textContent = user.email || "";
      avatar.innerHTML = picture
        ? '<img src="' + picture + '" alt="" referrerpolicy="no-referrer">'
        : (fullName.trim()[0] || "?").toUpperCase();
      account.style.display = "";
      if (logoutBtn) logoutBtn.style.display = "none";
    } else {
      account.style.display = "none";
      if (logoutBtn) logoutBtn.style.display = "";
    }
  }

  avatar.addEventListener("click", (e) => {
    e.stopPropagation();
    menu.classList.toggle("open");
  });
  document.addEventListener("click", (e) => {
    if (!account.contains(e.target)) menu.classList.remove("open");
  });
  // Le contenu de l'app est dans des <iframe> : un clic « à côté » s'y produit
  // et n'atteint pas le document parent. On ferme donc le menu dès que le focus
  // quitte la fenêtre (clic dans une iframe, changement d'onglet, etc.).
  window.addEventListener("blur", () => menu.classList.remove("open"));

  FoodHomeCloud.onUser(render);
  FoodHomeCloud.init();
})();
    </script>
  </body>
</html>
